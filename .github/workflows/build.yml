name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: 34

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/ciphervault-release-keystore.jks
            echo "keystore_exists=true" >> $GITHUB_OUTPUT
          else
            echo "keystore_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create signing config
        if: steps.decode_keystore.outputs.keystore_exists == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > app/signing.properties << EOF
          keystorePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        if: steps.decode_keystore.outputs.keystore_exists == 'true'
        run: ./gradlew assembleRelease --no-daemon -PsigningPropertiesFile=app/signing.properties

      - name: Prepare APK for Release
        run: |
          mkdir -p apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk apk/btkbmouse-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk apk/btkbmouse-release.apk
          fi
          ls -la apk/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apk/btkbmouse-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: steps.decode_keystore.outputs.keystore_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apk/btkbmouse-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apk/btkbmouse-debug.apk
            apk/btkbmouse-release.apk
          body: |
            # BT-KB-Mouse v1.0.0
            
            Professional Bluetooth Mouse & Keyboard control app for Android.
            
            ## Features
            - Bluetooth HID device management
            - Mouse DPI & scroll speed controls
            - Keyboard layout & media keys
            - Dark neon themed UI
            - Auto-reconnect & foreground service
            
            ## Downloads
            - `btkbmouse-debug.apk` - Debug build
            - `btkbmouse-release.apk` - Signed release build
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Release APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        shell: bash

      - name: Build with Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          ./gradlew assembleRelease -Prelease keystore=app/release.keystore -PkeystorePassword=$KEYSTORE_PASSWORD -PkeyAlias=$KEY_ALIAS -PkeyPassword=$KEY_PASSWORD --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            VERSION_TAG=${GITHUB_REF#refs/tags/}
            if [ "$VERSION_TAG" == "$GITHUB_REF" ]; then
              VERSION_TAG="latest"
            fi
            cp app/build/outputs/apk/release/app-release.apk "apk/BTKBMouse-${VERSION_TAG}.apk"
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk apk/
          fi
          ls -la apk/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apk/app-debug.apk
          retention-days: 7

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apk/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: apk/*.apk
          body: "BT-KB-Mouse Android App - Release ${{ github.ref_name }}
          
Features:
- Bluetooth HID device management
- Mouse DPI & scroll speed controls  
- Keyboard layout & media keys
- Dark neon themed UI
- Auto-reconnect & foreground service"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: 34
  ANDROID_BUILD_TOOLS_VERSION: '34.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/ciphervault-release-keystore.jks
            echo "keystore_exists=true" >> $GITHUB_OUTPUT
          else
            echo "keystore_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create signing config
        if: steps.decode_keystore.outputs.keystore_exists == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > app/signing.properties << EOF
          keystorePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        if: steps.decode_keystore.outputs.keystore_exists == 'true'
        run: |
          ./gradlew assembleRelease --no-daemon -PsigningPropertiesFile=app/signing.properties

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        if: steps.decode_keystore.outputs.keystore_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Copy APKs to project
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/*.apk apk/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk apk/ 2>/dev/null || true

      - name: Upload APKs to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            apk/*.apk
          retention-days: 30
